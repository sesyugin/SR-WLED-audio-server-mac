<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="300" viewBox="0 0 1240 300" role="img"><rect x="0" y="0" width="1240" height="300" rx="14" fill="#13100E"/><text x="36.0" y="46.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#F0EBE6" text-anchor="start">Путь сигнала</text><text x="36.0" y="70.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#9A8F86" text-anchor="start">от того, что играет, до светящейся полосы на ленте</text><rect x="36.0" y="104" width="172" height="116" rx="10" fill="#1D1917" stroke="#3A322D" stroke-width="1"/><text x="122.0" y="131.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#F0EBE6" text-anchor="middle">Системный звук</text><text x="122.0" y="156.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="400" fill="#9A8F86" text-anchor="middle">CoreAudio</text><text x="122.0" y="172.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="400" fill="#9A8F86" text-anchor="middle">process tap</text><text x="122.0" y="196.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#9A8F86" text-anchor="middle">драйвер не нужен,</text><text x="122.0" y="210.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#9A8F86" text-anchor="middle">звук идёт в колонки</text><path d="M214.0 162.0 H230.0" stroke="162.0" stroke-width="1.5"/><path d="M232.0 162.0 l-6 -4 v8 z" fill="#E8862A"/><rect x="238.0" y="104" width="172" height="116" rx="10" fill="#1D1917" stroke="#3A322D" stroke-width="1"/><text x="324.0" y="131.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#F0EBE6" text-anchor="middle">Окно анализа</text><text x="324.0" y="156.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="400" fill="#9A8F86" text-anchor="middle">2048 отсчётов,</text><text x="324.0" y="172.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="400" fill="#9A8F86" text-anchor="middle">шаг 512</text><text x="324.0" y="196.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#9A8F86" text-anchor="middle">новый кадр</text><text x="324.0" y="210.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#9A8F86" text-anchor="middle">каждые 10.7 мс</text><path d="M416.0 162.0 H432.0" stroke="162.0" stroke-width="1.5"/><path d="M434.0 162.0 l-6 -4 v8 z" fill="#E8862A"/><rect x="440.0" y="104" width="172" height="116" rx="10" fill="#1D1917" stroke="#3A322D" stroke-width="1"/><text x="526.0" y="131.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#F0EBE6" text-anchor="middle">БПФ</text><text x="526.0" y="156.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="400" fill="#9A8F86" text-anchor="middle">окно Hann,</text><text x="526.0" y="172.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="400" fill="#9A8F86" text-anchor="middle">свёртка по энергии</text><text x="526.0" y="196.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#9A8F86" text-anchor="middle">1024 бина</text><text x="526.0" y="210.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#9A8F86" text-anchor="middle">в 16 полос</text><path d="M618.0 162.0 H634.0" stroke="162.0" stroke-width="1.5"/><path d="M636.0 162.0 l-6 -4 v8 z" fill="#E8862A"/><rect x="642.0" y="104" width="172" height="116" rx="10" fill="#1D1917" stroke="#3A322D" stroke-width="1"/><text x="728.0" y="131.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#F0EBE6" text-anchor="middle">Полосы</text><text x="728.0" y="156.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="400" fill="#9A8F86" text-anchor="middle">таблица</text><text x="728.0" y="172.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="400" fill="#9A8F86" text-anchor="middle">из прошивки</text><text x="728.0" y="196.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#9A8F86" text-anchor="middle">43 Гц … 9259 Гц</text><path d="M820.0 162.0 H836.0" stroke="162.0" stroke-width="1.5"/><path d="M838.0 162.0 l-6 -4 v8 z" fill="#E8862A"/><rect x="844.0" y="104" width="172" height="116" rx="10" fill="#1D1917" stroke="#3A322D" stroke-width="1"/><text x="930.0" y="131.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#F0EBE6" text-anchor="middle">Пакет</text><text x="930.0" y="156.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="400" fill="#9A8F86" text-anchor="middle">44 байта,</text><text x="930.0" y="172.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="400" fill="#9A8F86" text-anchor="middle">audiosync v2</text><text x="930.0" y="196.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#9A8F86" text-anchor="middle">не чаще</text><text x="930.0" y="210.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#9A8F86" text-anchor="middle">50 в секунду</text><path d="M1022.0 162.0 H1038.0" stroke="162.0" stroke-width="1.5"/><path d="M1040.0 162.0 l-6 -4 v8 z" fill="#E8862A"/><rect x="1046.0" y="104" width="172" height="116" rx="10" fill="#241B12" stroke="#8A5620" stroke-width="1"/><text x="1132.0" y="131.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#E8862A" text-anchor="middle">Лента</text><text x="1132.0" y="156.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="400" fill="#9A8F86" text-anchor="middle">WLED</text><text x="1132.0" y="172.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="400" fill="#9A8F86" text-anchor="middle">Audio Reactive</text><text x="1132.0" y="196.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#9A8F86" text-anchor="middle">режим Receive,</text><text x="1132.0" y="210.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#9A8F86" text-anchor="middle">порт 11988</text><line x1="36" y1="244" x2="1204" y2="244" stroke="#3A322D"/><text x="36.0" y="264.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#9A8F86" text-anchor="start">В сеть уходит только это:</text><text x="215.0" y="264.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#F0EBE6" text-anchor="start">16 значений эквалайзера и несколько чисел уровня. Звук не записывается и не передаётся — восстановить его по 44 байтам нельзя.</text></svg>